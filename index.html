<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="kanyoai AI website builder and premium HTML, CSS, and JavaScript template library."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>kanyoai</title>
  </head>
  <body>
    <div
      id="app-loading"
      style="position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:opacity .18s ease"
    >
      <main
        style="min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      >
        <div style="text-align:center">
          <div
            style="width:44px;height:44px;margin:0 auto;border:1px solid #dbe3ef;border-radius:12px;background:#fff;box-shadow:0 12px 34px rgba(15,23,42,.08);display:grid;place-items:center"
          >
            <div
              style="width:18px;height:18px;border:2px solid #dbe3ef;border-top-color:#0568d8;border-radius:999px;animation:kanyo-spin .75s linear infinite"
            ></div>
          </div>
          <p style="margin:16px 0 0;font-size:15px;font-weight:700">Loading kanyoai</p>
          <p style="margin:4px 0 0;font-size:13px;color:#64748b">Preparing your workspace...</p>
        </div>
      </main>
    </div>
    <div id="root"></div>
    <style>
      @keyframes kanyo-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" src="/src/spa-entry.tsx"></script>
  </body>
</html>
